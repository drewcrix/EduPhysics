[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eduphysics-fluids"
version = "1.0.0"
description = "Cut-cell incompressible Navier-Stokes solver and offline dataset generator for the EduPhysics airfoil simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
eduphysics-fluids = "eduphysics_fluids.cli:main"

[tool.setuptools]
packages = ["eduphysics_fluids"]

[tool.ruff]
line-length = 150                       # the ported solver keeps the reference code's long stencil lines
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "NPY"]
# E702/E731: compact one-line statements and small lambdas as in the reference solver
# B905: zip() over arrays that are equal-length by construction
ignore = ["E702", "E731", "B905"]
